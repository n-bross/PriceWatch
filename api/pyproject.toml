[project]
name = "pricewatch-api"
version = "0.1.0"
description = "PriceWatch price and offer ingestion API"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "httpx>=0.27,<1",
  "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
  "python-dotenv>=1,<2",
  "beautifulsoup4>=4.15.0",
  "pymupdf>=1.28.2",
  "python-multipart>=0.0.32",
]

[project.optional-dependencies]
browser = ["playwright>=1.50,<2"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["pricewatch_api*"]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.setuptools.package-data]
pricewatch_api = ["*.html", "*.js", "*.json"]
