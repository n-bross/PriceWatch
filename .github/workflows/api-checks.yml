name: API checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: pricewatch-test
          POSTGRES_DB: pricewatch_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d pricewatch_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PRICEWATCH_TEST_DATABASE_URL: postgresql://postgres:pricewatch-test@localhost:5432/pricewatch_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --project api --frozen --python 3.12
      - name: Apply backend migrations to disposable PostgreSQL
        run: |
          psql "$PRICEWATCH_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f api/tests/postgres-roles.sql
          for migration in supabase/migrations/000[4-9]_*.sql; do
            psql "$PRICEWATCH_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f "$migration"
          done
      - run: uv run --project api --frozen ruff check api
      - run: uv run --project api --frozen pytest api/tests -q

  javascript:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: api/tests/browser
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: api/tests/browser/package-lock.json
      - run: npm ci
      - run: npm test
